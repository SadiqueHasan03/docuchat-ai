spring:
  application:
    name: docuchat-rag-service
  profiles:
    # Pick one model profile (openai | ollama) and one store profile (pgvector | chroma).
    # Air-gapped mode (NFR-SEC-03): SPRING_PROFILES_ACTIVE=ollama,pgvector
    active: openai,pgvector
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:docuchat}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  ai:
    model:
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2000ms
        multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  observations:
    key-values:
      application: docuchat-rag-service

docuchat:
  vector-store-provider: PGVECTOR
  security:
    # HS256 secret for JWT signing and validation; set JWT_SECRET to at least 32 random bytes.
    jwt-secret: ${JWT_SECRET:}
  ingestion:
    max-file-size: 50MB
    chunk-size: 800
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
  rag:
    default-top-k: 5
    max-top-k: 20
    similarity-threshold: 0.70
    memory-window: 10
    rewrite-query-enabled: false

---
# ---------- Model profile: OpenAI ----------
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small

---
# ---------- Model profile: Ollama (local) ----------
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.1
          temperature: 0.1
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        dimensions: 768   # nomic-embed-text; use 1024 for mxbai-embed-large

---
# ---------- Store profile: PGVector (production default) ----------
spring:
  config:
    activate:
      on-profile: pgvector
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 500
docuchat:
  vector-store-provider: PGVECTOR

---
# ---------- Store profile: ChromaDB ----------
spring:
  config:
    activate:
      on-profile: chroma
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  ai:
    vectorstore:
      chroma:
        client:
          host: http://${CHROMA_HOST:localhost}
          port: ${CHROMA_PORT:8000}
        collection-name: docuchat_embeddings
        initialize-schema: true
docuchat:
  vector-store-provider: CHROMA
